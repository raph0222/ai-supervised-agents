services:
  db:
    image: pgvector/pgvector:pg16
    container_name: northbridge-db
    environment:
      POSTGRES_USER: northbridge
      POSTGRES_PASSWORD: northbridge
      POSTGRES_DB: northbridge
    ports:
      - "5433:5432"
    volumes:
      - northbridge-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U northbridge -d northbridge"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: northbridge-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://northbridge:northbridge@db:5432/northbridge
      SEED_ON_STARTUP: "true"
      GOOGLE_APPLICATION_CREDENTIALS: /srv/secrets/gcp.json
    env_file:
      - path: .env
        required: false
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/srv/backend
      - ./seed:/srv/seed:ro
      - ./scripts:/srv/scripts:ro
      - ${GOOGLE_CREDENTIALS_FILE:-/dev/null}:/srv/secrets/gcp.json:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /srv/backend/app --timeout-graceful-shutdown 5

  frontend:
    image: node:22-alpine
    container_name: northbridge-frontend
    working_dir: /app
    depends_on:
      - api
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
      VITE_USE_POLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - northbridge-node-modules:/app/node_modules
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0"

volumes:
  northbridge-pgdata:
  northbridge-node-modules:
